apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Signing secrets, read from android/keystore.properties. That file is gitignored and
// must stay that way: a signing key in a public repo is the app's identity given away,
// and anyone holding it can publish an update that Play and every installed phone will
// accept as yours. Losing it is just as bad in the other direction — Play will not let
// you update an app signed with a different key, ever.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "social.poppys.app"
    defaultConfig {
        applicationId "social.poppys.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    // Read from android/keystore.properties, which is gitignored and never committed.
    // A signing key in a public repo is the app's identity given away: anyone holding
    // it can publish an update that Play and every installed phone will accept as
    // yours.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (keystoreProps.size() > 0) {
            release {
                // rootProject.file, not file: this block lives in app/build.gradle, so a
                // plain file() resolves against android/app/ while keystore.properties
                // sits in android/ and names a path beside itself. The keystore was
                // where it was meant to be and Gradle was looking one directory down.
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // The debug key was the default here, and Play rejects an app signed with
            // it — every developer's debug key is the same key. This uses the real one
            // when android/keystore.properties exists and falls back to debug when it
            // does not, so a checkout without the secrets still builds and runs.
            signingConfig signingConfigs.hasProperty('release') && keystoreProps.size() > 0
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// ── The web UI ───────────────────────────────────────────────────────────────
//
// The desktop frontend *is* the app's interface on both platforms, loaded in a
// WebView from file:///android_asset/web/index.html. It is copied in at build time
// rather than duplicated in the repo, so there is one copy of every screen and a
// change to the UI reaches Android on the next build.
//
// iOS has done this since the spike, through a "Copy Poppys web UI" build phase.
// Android never had the equivalent, so android_asset/web did not exist and the
// WebView had nothing to load — the app would start and show a blank page.
//
// Kept deliberately parallel to that phase, including the exclusions: model weights
// and video loops are large and unused on device.
def frontendDir = file("$rootDir/../../frontend")
def overlayDir  = file("$rootDir/../web-overlay")
def webAssets   = file("$projectDir/src/main/assets/web")

tasks.register('copyPoppysWebUI') {
    description = 'Copies the frontend into assets/web for the WebView.'
    inputs.dir frontendDir
    if (overlayDir.exists()) inputs.dir overlayDir
    outputs.dir webAssets
    doLast {
        if (!frontendDir.exists()) {
            throw new GradleException("frontend not found at $frontendDir")
        }
        delete webAssets
        copy {
            from(frontendDir) {
                exclude '**/*.glb', '**/*.mp4', '**/*.webm', '**/.DS_Store'
            }
            into webAssets
        }
        // Two copies rather than two `from` blocks in one: with both in a single Copy
        // task the overlay did not win, and the desktop mic.js shipped — which asks for
        // getUserMedia from a file:// origin and never gets a microphone on the phone.
        if (overlayDir.exists()) {
            copy {
                from overlayDir
                into webAssets
                duplicatesStrategy = DuplicatesStrategy.INCLUDE
            }
            logger.lifecycle("applied web overlay: " + overlayDir.list().join(' '))
        }
        logger.lifecycle("copied web UI -> $webAssets")
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn 'copyPoppysWebUI'
    }
}
